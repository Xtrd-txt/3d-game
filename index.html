<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler - Roguelike</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #game-canvas {
            display: block;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
        }

        /* Health bar */
        #health-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #health-icon {
            font-size: 28px;
        }

        #health-bar {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff4444;
            border-radius: 10px;
            overflow: hidden;
        }

        #health-fill {
            height: 100%;
            background: linear-gradient(to bottom, #ff6666, #ff4444);
            transition: width 0.3s ease;
        }

        #health-text {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Ammo */
        #ammo-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #ammo-icon {
            font-size: 28px;
        }

        /* Armor */
        #armor-container {
            position: absolute;
            bottom: 60px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #armor-icon {
            font-size: 24px;
        }

        #armor-bar {
            width: 150px;
            height: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4488ff;
            border-radius: 8px;
            overflow: hidden;
        }

        #armor-fill {
            height: 100%;
            background: linear-gradient(to bottom, #6699ff, #4488ff);
            transition: width 0.3s ease;
        }

        /* Level info */
        #level-info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Buffs display */
        #buffs-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .buff-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border-left: 3px solid #ffcc00;
        }

        /* Super buffs */
        .super-buff {
            border-left: 3px solid #ff00ff;
            background: rgba(100, 0, 100, 0.5);
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }

        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }

        /* Damage indicator */
        .damage-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: 20px solid rgba(255, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .damage-indicator.active {
            opacity: 1;
        }

        /* Messages */
        #message-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #message-container.visible {
            opacity: 1;
        }

        /* Upgrade selection menu */
        #upgrade-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 30px;
            display: none;
            pointer-events: auto;
        }

        #upgrade-menu h2 {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        .upgrade-options {
            display: flex;
            gap: 15px;
        }

        .upgrade-option {
            background: rgba(50, 50, 50, 0.9);
            border: 2px solid #666;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 120px;
        }

        .upgrade-option:hover {
            border-color: #ffcc00;
            background: rgba(80, 80, 50, 0.9);
            transform: scale(1.05);
        }

        .upgrade-option .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .upgrade-option .name {
            font-size: 14px;
            color: #fff;
        }

        /* Super buff selection */
        #super-buff-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(50, 0, 50, 0.95);
            border: 2px solid #ff00ff;
            border-radius: 15px;
            padding: 30px;
            display: none;
            pointer-events: auto;
        }

        #super-buff-menu h2 {
            text-align: center;
            color: #ff00ff;
            margin-bottom: 20px;
        }

        .super-buff-option {
            background: rgba(80, 0, 80, 0.9);
            border: 2px solid #aa00aa;
        }

        .super-buff-option:hover {
            border-color: #ff00ff;
            background: rgba(100, 0, 100, 0.9);
        }

        /* Start/Death screen */
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        #screen-overlay h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }

        #screen-overlay .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        #start-button, #restart-button {
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(to bottom, #ff6666, #ff4444);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #start-button:hover, #restart-button:hover {
            transform: scale(1.1);
        }

        .stats {
            margin-top: 30px;
            text-align: center;
            color: #aaa;
        }

        .stats div {
            margin: 5px 0;
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        /* Enemy health bar */
        .enemy-health-bar {
            position: absolute;
            width: 60px;
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 3px;
            overflow: hidden;
            transform: translate(-50%, -50%);
        }

        .enemy-health-fill {
            height: 100%;
            background: #ff4444;
            transition: width 0.2s ease;
        }

        /* Boss health bar */
        #boss-health-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            display: none;
        }

        #boss-name {
            text-align: center;
            font-size: 20px;
            color: #ff4444;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #boss-health-bar {
            width: 100%;
            height: 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff4444;
            border-radius: 12px;
            overflow: hidden;
        }

        #boss-health-fill {
            height: 100%;
            background: linear-gradient(to bottom, #ff6666, #aa0000);
            transition: width 0.3s ease;
        }

        /* Minimap */
        #minimap {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 5px;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        /* Hit marker */
        #hit-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #ff4444;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        /* Critical hit */
        .critical {
            color: #ffcc00 !important;
            font-size: 32px !important;
            text-shadow: 0 0 15px rgba(255, 200, 0, 0.8) !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <!-- Level info -->
            <div id="level-info">
                <div>Уровень: <span id="current-level">1</span></div>
                <div>Враги: <span id="enemies-count">0</span></div>
            </div>

            <!-- Buffs display -->
            <div id="buffs-container"></div>

            <!-- Boss health -->
            <div id="boss-health-container">
                <div id="boss-name">БОСС</div>
                <div id="boss-health-bar">
                    <div id="boss-health-fill"></div>
                </div>
            </div>

            <!-- Crosshair -->
            <div id="crosshair"></div>

            <!-- Hit marker -->
            <div id="hit-marker">✕</div>

            <!-- Health -->
            <div id="armor-container">
                <span id="armor-icon">🛡️</span>
                <div id="armor-bar">
                    <div id="armor-fill"></div>
                </div>
            </div>

            <div id="health-container">
                <span id="health-icon">❤️</span>
                <div id="health-bar">
                    <div id="health-fill"></div>
                </div>
                <span id="health-text">3/3</span>
            </div>

            <!-- Ammo -->
            <div id="ammo-container">
                <span id="ammo-icon">🔫</span>
                <span id="ammo-text">30</span>
            </div>

            <!-- Minimap -->
            <div id="minimap">
                <canvas id="minimap-canvas"></canvas>
            </div>

            <!-- Damage indicator -->
            <div class="damage-indicator" id="damage-indicator"></div>

            <!-- Messages -->
            <div id="message-container"></div>

            <!-- Upgrade menu -->
            <div id="upgrade-menu">
                <h2>Выберите улучшение</h2>
                <div class="upgrade-options" id="upgrade-options"></div>
            </div>

            <!-- Super buff menu -->
            <div id="super-buff-menu">
                <h2>⚡ СУПЕР СПОСОБНОСТЬ ⚡</h2>
                <div class="upgrade-options" id="super-buff-options"></div>
            </div>

            <!-- Start screen -->
            <div id="screen-overlay">
                <h1>DUNGEON CRAWLER</h1>
                <div class="subtitle">Рогалик с процедурной генерацией</div>
                <button id="start-button">НАЧАТЬ ИГРУ</button>
                <div id="controls-hint">
                    <p>WASD - движение | Мышь - обзор</p>
                    <p>ЛКМ - стрелять | ПКМ - удар</p>
                    <p>E - взаимодействие</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Game scripts -->
    <script src="js/utils.js"></script>
    <script src="js/dungeon-generator.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/items.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
