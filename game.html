<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler - Roguelike</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        #game-canvas { display: block; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: white; }
        #health-container { position: absolute; bottom: 30px; left: 30px; display: flex; align-items: center; gap: 10px; }
        #health-icon { font-size: 28px; }
        #health-bar { width: 200px; height: 20px; background: rgba(0,0,0,0.6); border: 2px solid #ff4444; border-radius: 10px; overflow: hidden; }
        #health-fill { height: 100%; background: linear-gradient(to bottom, #ff6666, #ff4444); transition: width 0.3s ease; }
        #health-text { font-size: 18px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #ammo-container { position: absolute; bottom: 30px; right: 30px; display: flex; align-items: center; gap: 10px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #ammo-icon { font-size: 28px; }
        #armor-container { position: absolute; bottom: 60px; left: 30px; display: flex; align-items: center; gap: 10px; }
        #armor-icon { font-size: 24px; }
        #armor-bar { width: 150px; height: 15px; background: rgba(0,0,0,0.6); border: 2px solid #4488ff; border-radius: 8px; overflow: hidden; }
        #armor-fill { height: 100%; background: linear-gradient(to bottom, #6699ff, #4488ff); transition: width 0.3s ease; }
        #level-info { position: absolute; top: 20px; left: 20px; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #buffs-container { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .buff-item { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; border-left: 3px solid #ffcc00; }
        .super-buff { border-left: 3px solid #ff00ff; background: rgba(100,0,100,0.5); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
        #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
        .damage-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; pointer-events: none; border: 20px solid rgba(255,0,0,0.5); opacity: 0; transition: opacity 0.1s ease; }
        .damage-indicator.active { opacity: 1; }
        #message-container { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s ease; }
        #message-container.visible { opacity: 1; }
        #upgrade-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid #ffcc00; border-radius: 15px; padding: 30px; display: none; pointer-events: auto; }
        #upgrade-menu h2 { text-align: center; color: #ffcc00; margin-bottom: 20px; }
        .upgrade-options { display: flex; gap: 15px; }
        .upgrade-option { background: rgba(50,50,50,0.9); border: 2px solid #666; border-radius: 10px; padding: 20px; cursor: pointer; transition: all 0.2s ease; text-align: center; min-width: 120px; }
        .upgrade-option:hover { border-color: #ffcc00; background: rgba(80,80,50,0.9); transform: scale(1.05); }
        .upgrade-option .icon { font-size: 36px; margin-bottom: 10px; }
        .upgrade-option .name { font-size: 14px; color: #fff; }
        #super-buff-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(50,0,50,0.95); border: 2px solid #ff00ff; border-radius: 15px; padding: 30px; display: none; pointer-events: auto; }
        #super-buff-menu h2 { text-align: center; color: #ff00ff; margin-bottom: 20px; }
        .super-buff-option { background: rgba(80,0,80,0.9); border: 2px solid #aa00aa; }
        .super-buff-option:hover { border-color: #ff00ff; background: rgba(100,0,100,0.9); }
        #screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        #screen-overlay h1 { font-size: 48px; color: #ff4444; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,68,68,0.5); }
        #screen-overlay .subtitle { font-size: 18px; color: #888; margin-bottom: 40px; }
        #start-button, #restart-button { padding: 15px 50px; font-size: 24px; background: linear-gradient(to bottom, #ff6666, #ff4444); border: none; border-radius: 10px; color: white; cursor: pointer; transition: transform 0.2s ease; }
        #start-button:hover, #restart-button:hover { transform: scale(1.1); }
        .stats { margin-top: 30px; text-align: center; color: #aaa; }
        .stats div { margin: 5px 0; }
        #controls-hint { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); text-align: center; font-size: 14px; color: #666; }
        .enemy-health-bar { position: absolute; width: 60px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; transform: translate(-50%, -50%); }
        .enemy-health-fill { height: 100%; background: #ff4444; transition: width 0.2s ease; }
        #boss-health-container { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 400px; display: none; }
        #boss-name { text-align: center; font-size: 20px; color: #ff4444; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #boss-health-bar { width: 100%; height: 25px; background: rgba(0,0,0,0.6); border: 2px solid #ff4444; border-radius: 12px; overflow: hidden; }
        #boss-health-fill { height: 100%; background: linear-gradient(to bottom, #ff6666, #aa0000); transition: width 0.3s ease; }
        #minimap { position: absolute; bottom: 100px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.7); border: 2px solid #444; border-radius: 5px; }
        #minimap-canvas { width: 100%; height: 100%; }
        #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #ff4444; opacity: 0; pointer-events: none; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
        .critical { color: #ffcc00 !important; font-size: 32px !important; text-shadow: 0 0 15px rgba(255,200,0,0.8) !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
            <div id="level-info"><div>Уровень: <span id="current-level">1</span></div><div>Враги: <span id="enemies-count">0</span></div></div>
            <div id="buffs-container"></div>
            <div id="boss-health-container"><div id="boss-name">БОСС</div><div id="boss-health-bar"><div id="boss-health-fill"></div></div></div>
            <div id="crosshair"></div>
            <div id="hit-marker">✕</div>
            <div id="armor-container"><span id="armor-icon">🛡️</span><div id="armor-bar"><div id="armor-fill"></div></div></div>
            <div id="health-container"><span id="health-icon">❤️</span><div id="health-bar"><div id="health-fill"></div></div><span id="health-text">3/3</span></div>
            <div id="ammo-container"><span id="ammo-icon">🔫</span><span id="ammo-text">30</span></div>
            <div id="minimap"><canvas id="minimap-canvas"></canvas></div>
            <div class="damage-indicator" id="damage-indicator"></div>
            <div id="message-container"></div>
            <div id="upgrade-menu"><h2>Выберите улучшение</h2><div class="upgrade-options" id="upgrade-options"></div></div>
            <div id="super-buff-menu"><h2>⚡ СУПЕР СПОСОБНОСТЬ ⚡</h2><div class="upgrade-options" id="super-buff-options"></div></div>
            <div id="screen-overlay"><h1>DUNGEON CRAWLER</h1><div class="subtitle">Рогалик с процедурной генерацией</div><button id="start-button">НАЧАТЬ ИГРУ</button><div id="controls-hint"><p>WASD - движение | Мышь - обзор</p><p>ЛКМ - стрелять | ПКМ - удар</p></div></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
// ===== UTILS =====
const Utils={randomInt(a,b){return Math.floor(Math.random()*(b-a+1))+a},randomFloat(a,b){return Math.random()*(b-a)+a},randomElement(a){return a[Math.floor(Math.random()*a.length)]},shuffleArray(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b},clamp(v,a,b){return Math.min(Math.max(v,a),b)},lerp(a,b,t){return a+(b-a)*t},distance(x1,y1,x2,y2){return Math.sqrt((x2-x1)**2+(y2-y1)**2)}};

// ===== TILE TYPES =====
const TILE_TYPES={EMPTY:0,FLOOR:1,WALL:2,DOOR:3,SPAWN:4,EXIT:5,BOSS_ROOM:6};

// ===== ROOM =====
class Room{constructor(x,y,w,h){this.x=x;this.y=y;this.width=w;this.height=h;this.centerX=Math.floor(x+w/2);this.centerY=Math.floor(y+h/2);this.connected=false;this.isBossRoom=false}intersects(o,p=1){return!(this.x+this.width+p<=o.x||o.x+o.width+p<=this.x||this.y+this.height+p<=o.y||o.y+o.height+p<=this.y)}distanceTo(o){return Utils.distance(this.centerX,this.centerY,o.centerX,o.centerY)}}

// ===== DUNGEON GENERATOR =====
class DungeonGenerator{constructor(w=50,h=50){this.width=w;this.height=h;this.tiles=[];this.rooms=[];this.spawnPoint=null;this.exitPoint=null;this.enemySpawnPoints=[];this.buffOrbSpawnPoints=[];this.ammoSpawnPoints=[];this.armorSpawnPoints=[];this.bossSpawnPoint=null}
generate(level=1){this.tiles=[];for(let y=0;y<this.height;y++){this.tiles[y]=[];for(let x=0;x<this.width;x++)this.tiles[y][x]=TILE_TYPES.EMPTY}this.rooms=[];this.enemySpawnPoints=[];this.buffOrbSpawnPoints=[];this.ammoSpawnPoints=[];this.armorSpawnPoints=[];this.generateRooms(level);this.connectRooms();this.generateWalls();this.setSpawnAndExit();this.generateEnemySpawns(level);this.generateItemSpawns();this.generateBuffOrbSpawns();return{tiles:this.tiles,rooms:this.rooms,spawnPoint:this.spawnPoint,exitPoint:this.exitPoint,bossSpawnPoint:this.bossSpawnPoint,enemySpawnPoints:this.enemySpawnPoints,buffOrbSpawnPoints:this.buffOrbSpawnPoints,ammoSpawnPoints:this.ammoSpawnPoints,armorSpawnPoints:this.armorSpawnPoints,width:this.width,height:this.height}}
generateRooms(level){const target=Utils.randomInt(5+Math.floor(level/2),8+level);let attempts=0;while(this.rooms.length<target&&attempts<500){attempts++;const w=Utils.randomInt(5,10),h=Utils.randomInt(5,10),x=Utils.randomInt(2,this.width-w-2),y=Utils.randomInt(2,this.height-h-2);const room=new Room(x,y,w,h);let ok=true;for(const r of this.rooms)if(room.intersects(r,2)){ok=false;break}if(ok){this.carveRoom(room);this.rooms.push(room)}}if(this.rooms.length>0){const bw=Utils.randomInt(10,14),bh=Utils.randomInt(10,14);attempts=0;while(attempts<500){attempts++;const x=Utils.randomInt(2,this.width-bw-2),y=Utils.randomInt(2,this.height-bh-2);const room=new Room(x,y,bw,bh);room.isBossRoom=true;let ok=true;for(const r of this.rooms)if(room.intersects(r,3)){ok=false;break}if(ok){this.carveRoom(room,TILE_TYPES.BOSS_ROOM);this.rooms.push(room);break}}}}
carveRoom(room,type=TILE_TYPES.FLOOR){for(let y=room.y;y<room.y+room.height;y++)for(let x=room.x;x<room.x+room.width;x++)if(y>=0&&y<this.height&&x>=0&&x<this.width)this.tiles[y][x]=type}
connectRooms(){if(this.rooms.length<2)return;const sorted=[...this.rooms];const connected=[sorted[0]];sorted[0].connected=true;while(connected.length<sorted.length){let bestDist=Infinity,bestRoom=null,connectFrom=null;for(const cr of connected)for(const r of sorted)if(!r.connected){const d=cr.distanceTo(r);if(d<bestDist){bestDist=d;bestRoom=r;connectFrom=cr}}if(bestRoom&&connectFrom){this.carveCorridor(connectFrom,bestRoom);bestRoom.connected=true;connected.push(bestRoom)}else break}}
carveCorridor(r1,r2){let x=r1.centerX,y=r1.centerY;const tx=r2.centerX,ty=r2.centerY;if(Math.random()>0.5){while(x!==tx){if(this.tiles[y]&&this.tiles[y][x]===TILE_TYPES.EMPTY)this.tiles[y][x]=TILE_TYPES.FLOOR;x+=x<tx?1:-1}while(y!==ty){if(this.tiles[y]&&this.tiles[y][x]===TILE_TYPES.EMPTY)this.tiles[y][x]=TILE_TYPES.FLOOR;y+=y<ty?1:-1}}else{while(y!==ty){if(this.tiles[y]&&this.tiles[y][x]===TILE_TYPES.EMPTY)this.tiles[y][x]=TILE_TYPES.FLOOR;y+=y<ty?1:-1}while(x!==tx){if(this.tiles[y]&&this.tiles[y][x]===TILE_TYPES.EMPTY)this.tiles[y][x]=TILE_TYPES.FLOOR;x+=x<tx?1:-1}}}
generateWalls(){for(let y=0;y<this.height;y++)for(let x=0;x<this.width;x++)if(this.tiles[y][x]===TILE_TYPES.EMPTY){let adj=false;for(let dy=-1;dy<=1&&!adj;dy++)for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<this.height&&nx>=0&&nx<this.width&&(this.tiles[ny][nx]===TILE_TYPES.FLOOR||this.tiles[ny][nx]===TILE_TYPES.BOSS_ROOM)){adj=true;break}}if(adj)this.tiles[y][x]=TILE_TYPES.WALL}}
setSpawnAndExit(){if(this.rooms.length<2)return;const boss=this.rooms.find(r=>r.isBossRoom)||this.rooms[this.rooms.length-1];let maxD=0,spawn=this.rooms[0];for(const r of this.rooms)if(!r.isBossRoom){const d=r.distanceTo(boss);if(d>maxD){maxD=d;spawn=r}}this.spawnPoint={x:spawn.centerX,y:spawn.centerY};this.bossSpawnPoint={x:boss.centerX,y:boss.centerY};this.exitPoint={x:boss.centerX+2,y:boss.centerY+2}}
generateEnemySpawns(level){const epr=Math.min(2+Math.floor(level/2),5);for(const room of this.rooms){if(room.isBossRoom)continue;const isSp=room.centerX===this.spawnPoint.x&&room.centerY===this.spawnPoint.y;const n=isSp?Math.max(0,epr-2):Utils.randomInt(1,epr);for(let i=0;i<n;i++){const x=Utils.randomInt(room.x+1,room.x+room.width-2),y=Utils.randomInt(room.y+1,room.y+room.height-2);if(Math.abs(x-this.spawnPoint.x)<3&&Math.abs(y-this.spawnPoint.y)<3)continue;this.enemySpawnPoints.push({x,y})}}}
generateItemSpawns(){const n=Utils.randomInt(3,5);const rooms=this.rooms.filter(r=>!r.isBossRoom);for(let i=0;i<n;i++){const r=Utils.randomElement(rooms);this.ammoSpawnPoints.push({x:Utils.randomInt(r.x+1,r.x+r.width-2),y:Utils.randomInt(r.y+1,r.y+r.height-2),amount:Utils.randomInt(5,10)})}if(Math.random()>0.3){const na=Utils.randomInt(1,2);for(let i=0;i<na;i++){const r=Utils.randomElement(rooms);this.armorSpawnPoints.push({x:Utils.randomInt(r.x+1,r.x+r.width-2),y:Utils.randomInt(r.y+1,r.y+r.height-2),value:Utils.randomInt(1,3)})}}}
generateBuffOrbSpawns(){const n=Utils.randomInt(1,2);const rooms=this.rooms.filter(r=>!r.isBossRoom);for(let i=0;i<n;i++){const r=rooms[i%rooms.length];this.buffOrbSpawnPoints.push({x:r.centerX,y:r.centerY})}}
isWalkable(x,y){const t=this.tiles[Math.floor(y)]?.[Math.floor(x)];return t===TILE_TYPES.FLOOR||t===TILE_TYPES.DOOR||t===TILE_TYPES.SPAWN||t===TILE_TYPES.EXIT||t===TILE_TYPES.BOSS_ROOM}}

// ===== DUNGEON MESH =====
class DungeonMeshGenerator{constructor(scene,ts=4){this.scene=scene;this.tileSize=ts;this.meshes=[];this.wallHeight=4;this.floorMat=new THREE.MeshLambertMaterial({color:0x444444,side:THREE.DoubleSide});this.wallMat=new THREE.MeshLambertMaterial({color:0x666666});this.bossMat=new THREE.MeshLambertMaterial({color:0x553333,side:THREE.DoubleSide})}
generate(data){this.clear();const{tiles,width,height}=data;for(let y=0;y<height;y++)for(let x=0;x<width;x++){const t=tiles[y][x],wx=x*this.tileSize,wz=y*this.tileSize;if(t===TILE_TYPES.FLOOR||t===TILE_TYPES.DOOR||t===TILE_TYPES.SPAWN||t===TILE_TYPES.EXIT){const fg=new THREE.PlaneGeometry(this.tileSize,this.tileSize);const fm=new THREE.Mesh(fg,this.floorMat);fm.rotation.x=-Math.PI/2;fm.position.set(wx,0,wz);this.scene.add(fm);this.meshes.push(fm);const cg=new THREE.PlaneGeometry(this.tileSize,this.tileSize);const cm=new THREE.Mesh(cg,this.floorMat);cm.rotation.x=Math.PI/2;cm.position.set(wx,this.wallHeight,wz);this.scene.add(cm);this.meshes.push(cm)}else if(t===TILE_TYPES.BOSS_ROOM){const fg=new THREE.PlaneGeometry(this.tileSize,this.tileSize);const fm=new THREE.Mesh(fg,this.bossMat);fm.rotation.x=-Math.PI/2;fm.position.set(wx,0,wz);this.scene.add(fm);this.meshes.push(fm);const cg=new THREE.PlaneGeometry(this.tileSize,this.tileSize);const cm=new THREE.Mesh(cg,this.bossMat);cm.rotation.x=Math.PI/2;cm.position.set(wx,this.wallHeight*1.5,wz);this.scene.add(cm);this.meshes.push(cm)}else if(t===TILE_TYPES.WALL){const wg=new THREE.BoxGeometry(this.tileSize,this.wallHeight,this.tileSize);const wm=new THREE.Mesh(wg,this.wallMat);wm.position.set(wx,this.wallHeight/2,wz);this.scene.add(wm);this.meshes.push(wm)}}this.addLights(data)}
addLights(data){for(const room of data.rooms){const c=room.isBossRoom?0xff4444:0xffaa44;const l=new THREE.PointLight(c,0.8,this.tileSize*6);l.position.set(room.centerX*this.tileSize,this.wallHeight*0.7,room.centerY*this.tileSize);this.scene.add(l);this.meshes.push(l)}}
clear(){for(const m of this.meshes){this.scene.remove(m);if(m.geometry)m.geometry.dispose();if(m.material)m.material.dispose()}this.meshes=[]}}

// ===== PLAYER =====
class Player{constructor(cam,scene){this.camera=cam;this.scene=scene;this.position=new THREE.Vector3(0,1.7,0);this.velocity=new THREE.Vector3();this.moveSpeed=8;this.jumpForce=8;this.gravity=20;this.isGrounded=true;this.pitch=0;this.yaw=0;this.height=1.7;this.maxHealth=3;this.health=3;this.armor=0;this.maxArmor=10;this.meleeDamage=2;this.rangedDamage=1;this.critChance=0.15;this.fireRate=1;this.ammo=30;this.maxAmmo=100;this.lastShotTime=0;this.lastMeleeTime=0;this.meleeCooldown=0.5;this.superBuffs={chainLightning:false,ricochet:false,bunnyHop:false,instantKill:false};this.buffs={health:0,fireRate:0,meleeDamage:0,rangedDamage:0};this.keys={forward:false,backward:false,left:false,right:false,jump:false};this.mouse={left:false,right:false};this.setupInput()}
setupInput(){document.addEventListener('keydown',e=>this.onKey(e,true));document.addEventListener('keyup',e=>this.onKey(e,false));document.addEventListener('mousemove',e=>{if(document.pointerLockElement){this.yaw-=e.movementX*0.002;this.pitch-=e.movementY*0.002;this.pitch=Utils.clamp(this.pitch,-1.5,1.5)}});document.addEventListener('mousedown',e=>{if(e.button===0)this.mouse.left=true;if(e.button===2)this.mouse.right=true});document.addEventListener('mouseup',e=>{if(e.button===0)this.mouse.left=false;if(e.button===2)this.mouse.right=false});document.getElementById('game-canvas').onclick=()=>{if(window.game?.isRunning&&!window.game?.isPaused)document.getElementById('game-canvas').requestPointerLock()}}
onKey(e,down){const k=this.keys;if(e.code==='KeyW')k.forward=down;if(e.code==='KeyS')k.backward=down;if(e.code==='KeyA')k.left=down;if(e.code==='KeyD')k.right=down;if(e.code==='Space')k.jump=down}
update(dt,dg,ts){this.camera.rotation.order='YXZ';this.camera.rotation.y=this.yaw;this.camera.rotation.x=this.pitch;const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion);fwd.y=0;fwd.normalize();const right=new THREE.Vector3(1,0,0).applyQuaternion(this.camera.quaternion);right.y=0;right.normalize();const dir=new THREE.Vector3();if(this.keys.forward)dir.add(fwd);if(this.keys.backward)dir.sub(fwd);if(this.keys.left)dir.sub(right);if(this.keys.right)dir.add(right);if(dir.length()>0)dir.normalize();this.velocity.x=dir.x*this.moveSpeed;this.velocity.z=dir.z*this.moveSpeed;if(!this.isGrounded)this.velocity.y-=this.gravity*dt;if(this.keys.jump&&(this.isGrounded||this.superBuffs.bunnyHop)){this.velocity.y=this.jumpForce;this.isGrounded=false}const np=this.position.clone();np.x+=this.velocity.x*dt;np.z+=this.velocity.z*dt;np.y+=this.velocity.y*dt;if(dg){const tx=Math.floor(np.x/ts),tz=Math.floor(this.position.z/ts);if(!dg.isWalkable(tx,tz))np.x=this.position.x;const tx2=Math.floor(this.position.x/ts),tz2=Math.floor(np.z/ts);if(!dg.isWalkable(tx2,tz2))np.z=this.position.z}if(np.y<this.height){np.y=this.height;this.velocity.y=0;this.isGrounded=true}if(np.y>3.5){np.y=3.5;this.velocity.y=0}this.position.copy(np);this.camera.position.copy(this.position)}
spawn(x,z,ts){this.position.set(x*ts+ts/2,this.height,z*ts+ts/2);this.velocity.set(0,0,0);this.yaw=0;this.pitch=0}
takeDamage(amt){if(this.armor>0){const ad=Math.min(this.armor,amt);this.armor-=ad;amt-=ad}if(amt>0){this.health-=amt;document.getElementById('damage-indicator').classList.add('active');setTimeout(()=>document.getElementById('damage-indicator').classList.remove('active'),100)}return this.health<=0}
addAmmo(n){this.ammo=Math.min(this.ammo+n,this.maxAmmo)}
addArmor(n){this.armor=Math.min(this.armor+n,this.maxArmor)}
canShoot(){return this.ammo>0&&(performance.now()/1000-this.lastShotTime)>=1/(this.fireRate+this.buffs.fireRate)}
canMelee(){return(performance.now()/1000-this.lastMeleeTime)>=this.meleeCooldown}
shoot(){if(!this.canShoot())return null;this.ammo--;this.lastShotTime=performance.now()/1000;let dmg=this.rangedDamage+this.buffs.rangedDamage,crit=false;if(Math.random()<this.critChance){dmg=Math.round(dmg*2.5);crit=true}let ik=this.superBuffs.instantKill&&Math.random()<0.05;return{damage:dmg,isCrit:crit,isInstantKill:ik,chainLightning:this.superBuffs.chainLightning,ricochet:this.superBuffs.ricochet}}
melee(){if(!this.canMelee())return null;this.lastMeleeTime=performance.now()/1000;let dmg=this.meleeDamage+this.buffs.meleeDamage,crit=false;if(Math.random()<this.critChance){dmg=5;crit=true}let ik=this.superBuffs.instantKill&&Math.random()<0.05;return{damage:dmg,isCrit:crit,isInstantKill:ik}}
applyBuff(t){if(t==='health'){this.maxHealth++;this.health++;this.buffs.health++}else if(t==='fireRate')this.buffs.fireRate++;else if(t==='meleeDamage')this.buffs.meleeDamage++;else if(t==='rangedDamage')this.buffs.rangedDamage++}
applySuperBuff(t){this.superBuffs[t]=true}
reset(){this.health=3;this.maxHealth=3;this.armor=0;this.ammo=30;this.superBuffs={chainLightning:false,ricochet:false,bunnyHop:false,instantKill:false};this.buffs={health:0,fireRate:0,meleeDamage:0,rangedDamage:0}}
getForward(){return new THREE.Vector3(0,0,-1).applyQuaternion(this.camera.quaternion)}}

class WeaponView{constructor(scene,cam){this.scene=scene;this.camera=cam;this.group=new THREE.Group();const g=new THREE.Group();const bm=new THREE.MeshLambertMaterial({color:0x333333});const bar=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,0.4),bm);bar.position.set(0,0,-0.2);g.add(bar);const hdl=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.15,0.1),bm);hdl.position.set(0,-0.1,0);g.add(hdl);g.position.set(0.25,-0.2,-0.4);this.group.add(g);this.gunGroup=g;const fm=new THREE.MeshBasicMaterial({color:0xffff00,transparent:true,opacity:0});this.flash=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),fm);this.flash.position.set(0.25,-0.2,-0.8);this.group.add(this.flash);this.camera.add(this.group);this.scene.add(this.camera);this.recoil=0}

const ENEMY_TYPES={BASIC:'basic',FAST:'fast',TANK:'tank',RANGED:'ranged',BOSS:'boss'};
class Enemy{constructor(scene,type,pos,level=1){this.scene=scene;this.type=type;this.level=level;this.position=pos.clone();this.velocity=new THREE.Vector3();this.target=null;this.setupStats();this.createMesh();this.state='idle';this.attackCooldown=0;this.isAlive=true;this.deathTimer=0;this.hurtTimer=0}
setupStats(){const base=3+(this.level-1);if(this.type===ENEMY_TYPES.BASIC){this.maxHealth=base;this.health=base;this.damage=1;this.speed=4;this.color=0xff4444;this.size=0.8;this.attackSpeed=1;this.attackRange=2}else if(this.type===ENEMY_TYPES.FAST){this.maxHealth=Math.max(1,base-1);this.health=this.maxHealth;this.damage=1;this.speed=7;this.color=0x44ff44;this.size=0.6;this.attackSpeed=1.5;this.attackRange=2}else if(this.type===ENEMY_TYPES.TANK){this.maxHealth=base+3;this.health=this.maxHealth;this.damage=2;this.speed=2;this.color=0x4444ff;this.size=1.2;this.attackSpeed=0.5;this.attackRange=2}else if(this.type===ENEMY_TYPES.RANGED){this.maxHealth=Math.max(1,base-1);this.health=this.maxHealth;this.damage=1;this.speed=3;this.color=0xff44ff;this.size=0.7;this.attackSpeed=0.8;this.attackRange=12}else if(this.type===ENEMY_TYPES.BOSS){this.maxHealth=base*5;this.health=this.maxHealth;this.damage=2;this.speed=3;this.color=0xff0000;this.size=2;this.attackSpeed=0.7;this.attackRange=3;this.bossPhase=1}}
createMesh(){const g=this.type===ENEMY_TYPES.BOSS?new THREE.BoxGeometry(this.size,this.size*1.5,this.size):new THREE.SphereGeometry(this.size/2,16,16);const m=new THREE.MeshLambertMaterial({color:this.color,emissive:this.color,emissiveIntensity:0.2});this.mesh=new THREE.Mesh(g,m);this.mesh.position.copy(this.position);this.scene.add(this.mesh);this.healthBar=document.createElement('div');this.healthBar.className='enemy-health-bar';this.healthFill=document.createElement('div');this.healthFill.className='enemy-health-fill';this.healthBar.appendChild(this.healthFill);if(this.type===ENEMY_TYPES.BOSS)this.healthBar.style.display='none'}
update(dt,player,dg,ts,projs){if(!this.isAlive){this.deathTimer+=dt;this.mesh.scale.multiplyScalar(0.95);this.mesh.position.y-=dt*2;return this.deathTimer<=0.5}if(this.hurtTimer>0){this.hurtTimer-=dt;this.mesh.material.emissiveIntensity=0.8}else this.mesh.material.emissiveIntensity=0.2;if(this.attackCooldown>0)this.attackCooldown-=dt;const dist=this.position.distanceTo(player.position);if(dist<15)this.target=player;if(this.target){if(dist<this.attackRange){if(this.attackCooldown<=0){this.attack(player,projs);this.attackCooldown=1/this.attackSpeed}}else{const dir=player.position.clone().sub(this.position);dir.y=0;dir.normalize();const np=this.position.clone().add(dir.multiplyScalar(this.speed*dt));const tx=Math.floor(np.x/ts),tz=Math.floor(np.z/ts);if(dg.isWalkable(tx,tz))this.position.copy(np)}const look=player.position.clone().sub(this.position);look.y=0;if(look.length()>0.1)this.mesh.rotation.y=Math.atan2(look.x,look.z)}this.mesh.position.copy(this.position);this.mesh.position.y=this.size/2;if(this.type===ENEMY_TYPES.BOSS){const hp=this.health/this.maxHealth;if(hp<0.3&&this.bossPhase<3){this.bossPhase=3;this.speed*=1.5;this.attackSpeed*=1.5}else if(hp<0.6&&this.bossPhase<2){this.bossPhase=2;this.speed*=1.2}}return true}
attack(player,projs){if(this.type===ENEMY_TYPES.RANGED){const dir=player.position.clone().sub(this.position).normalize();projs.push(new EnemyProjectile(this.scene,this.position.clone().add(new THREE.Vector3(0,this.size/2,0)),dir,10,this.damage))}else if(this.position.distanceTo(player.position)<this.attackRange+0.5&&window.game)window.game.playerTakeDamage(this.damage)}
takeDamage(amt,ik=false){if(!this.isAlive)return false;this.health=ik?0:this.health-amt;this.hurtTimer=0.1;if(this.health<=0){this.isAlive=false;this.healthBar.style.display='none';return true}return false}
updateHealthBar(cam){if(!this.isAlive||this.type===ENEMY_TYPES.BOSS)return;const sp=this.position.clone();sp.y+=this.size+0.5;sp.project(cam);const x=(sp.x*0.5+0.5)*window.innerWidth,y=(-(sp.y*0.5)+0.5)*window.innerHeight;if(sp.z<1&&sp.z>0){this.healthBar.style.display='block';this.healthBar.style.left=x+'px';this.healthBar.style.top=(y-40)+'px';this.healthFill.style.width=(this.health/this.maxHealth*100)+'%'}else this.healthBar.style.display='none'}
destroy(){this.scene.remove(this.mesh);this.mesh.geometry?.dispose();this.mesh.material?.dispose();this.healthBar.parentNode?.removeChild(this.healthBar)}}

class EnemyProjectile{constructor(scene,pos,dir,spd,dmg){this.scene=scene;this.position=pos.clone();this.direction=dir.normalize();this.speed=spd;this.damage=dmg;this.age=0;this.isAlive=true;const g=new THREE.SphereGeometry(0.15,8,8);const m=new THREE.MeshBasicMaterial({color:0xff0000});this.mesh=new THREE.Mesh(g,m);this.mesh.position.copy(this.position);this.scene.add(this.mesh)}
update(dt,player,dg,ts){if(!this.isAlive)return false;this.age+=dt;if(this.age>5){this.destroy();return false}this.position.add(this.direction.clone().multiplyScalar(this.speed*dt));this.mesh.position.copy(this.position);if(this.position.distanceTo(player.position)<1){window.game?.playerTakeDamage(this.damage);this.destroy();return false}const tx=Math.floor(this.position.x/ts),tz=Math.floor(this.position.z/ts);if(!dg.isWalkable(tx,tz)){this.destroy();return false}return true}
destroy(){this.isAlive=false;this.scene.remove(this.mesh);this.mesh.geometry?.dispose();this.mesh.material?.dispose()}}

class EnemyManager{constructor(scene){this.scene=scene;this.enemies=[];this.projectiles=[];this.hbc=null}
init(){this.hbc=document.createElement('div');this.hbc.id='enemy-health-bars';document.getElementById('hud').appendChild(this.hbc)}
spawnEnemies(spawns,level){this.clear();for(const sp of spawns){const r=Math.random();let type=ENEMY_TYPES.BASIC;if(r>0.85)type=ENEMY_TYPES.RANGED;else if(r>0.7)type=ENEMY_TYPES.TANK;else if(r>0.5)type=ENEMY_TYPES.FAST;const pos=new THREE.Vector3(sp.x*4+2,0,sp.y*4+2);const e=new Enemy(this.scene,type,pos,level);this.hbc.appendChild(e.healthBar);this.enemies.push(e)}}
spawnBoss(sp,level){const pos=new THREE.Vector3(sp.x*4+2,0,sp.y*4+2);const b=new Enemy(this.scene,ENEMY_TYPES.BOSS,pos,level);this.enemies.push(b);return b}
update(dt,player,dg,ts,cam){this.enemies=this.enemies.filter(e=>{const alive=e.update(dt,player,dg,ts,this.projectiles);if(!alive)e.destroy();else e.updateHealthBar(cam);return alive});this.projectiles=this.projectiles.filter(p=>p.update(dt,player,dg,ts))}
getAliveCount(){return this.enemies.filter(e=>e.isAlive).length}
clear(){for(const e of this.enemies)e.destroy();this.enemies=[];for(const p of this.projectiles)p.destroy();this.projectiles=[];if(this.hbc)this.hbc.innerHTML=''}}

const ITEM_TYPES={AMMO:'ammo',ARMOR:'armor',BUFF_ORB:'buffOrb',EXIT_PORTAL:'exitPortal'};
const BUFF_TYPES=[{id:'health',name:'+1 Здоровье',icon:'❤️'},{id:'fireRate',name:'+1 Скорострельность',icon:'🔥'},{id:'meleeDamage',name:'+1 Урон (кулак)',icon:'👊'},{id:'rangedDamage',name:'+1 Урон (оружие)',icon:'🎯'}];
const SUPER_BUFF_TYPES=[{id:'chainLightning',name:'Цепная молния',description:'Бьет нескольких врагов',icon:'⚡'},{id:'ricochet',name:'Рикошет',description:'Пули отскакивают',icon:'🔄'},{id:'bunnyHop',name:'Банни-хоп',description:'Прыжки в воздухе',icon:'🐰'},{id:'instantKill',name:'Казнь',description:'5% мгновенное убийство',icon:'💀'}];

class Item{constructor(scene,type,pos,data={}){this.scene=scene;this.type=type;this.position=pos.clone();this.data=data;this.isCollected=false;this.timer=0;this.createMesh()}
createMesh(){if(this.type===ITEM_TYPES.AMMO){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.3,0.25),new THREE.MeshLambertMaterial({color:0x8B4513}));g.add(b);g.position.copy(this.position);g.position.y=0.5;this.mesh=g;this.light=new THREE.PointLight(0xffcc00,0.5,3);this.light.position.copy(this.position);this.light.position.y=1}else if(this.type===ITEM_TYPES.ARMOR){const g=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.6,0.1),new THREE.MeshLambertMaterial({color:0x4488ff,emissive:0x224488,emissiveIntensity:0.3}));g.position.copy(this.position);g.position.y=0.8;this.mesh=g;this.light=new THREE.PointLight(0x4488ff,0.5,3);this.light.position.copy(this.position);this.light.position.y=1}else if(this.type===ITEM_TYPES.BUFF_ORB){const g=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16),new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:0.9}));g.position.copy(this.position);g.position.y=1.5;this.mesh=g;this.light=new THREE.PointLight(0xffcc00,1,8);this.light.position.copy(this.position);this.light.position.y=1.5}else if(this.type===ITEM_TYPES.EXIT_PORTAL){const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(1,0.1,8,32),new THREE.MeshBasicMaterial({color:0x00ff00,transparent:true,opacity:0.8}));ring.rotation.x=Math.PI/2;g.add(ring);g.position.copy(this.position);g.position.y=0.5;this.mesh=g;this.light=new THREE.PointLight(0x00ff00,1,6);this.light.position.copy(this.position);this.light.position.y=1;this.setVisible(false)}this.scene.add(this.mesh);if(this.light)this.scene.add(this.light)}
update(dt){if(this.isCollected)return;this.timer+=dt;const bob=Math.sin(this.timer*2)*0.2;if(this.type===ITEM_TYPES.BUFF_ORB)this.mesh.position.y=1.5+bob;else if(this.type!==ITEM_TYPES.EXIT_PORTAL){this.mesh.position.y=0.5+bob;this.mesh.rotation.y+=dt}}
checkCollection(pp){if(this.isCollected)return false;return this.position.distanceTo(new THREE.Vector3(pp.x,this.position.y,pp.z))<1.5}
collect(){this.isCollected=true;this.scene.remove(this.mesh);if(this.light)this.scene.remove(this.light)}
setVisible(v){if(this.mesh)this.mesh.visible=v;if(this.light)this.light.visible=v}
destroy(){if(this.mesh)this.scene.remove(this.mesh);if(this.light)this.scene.remove(this.light)}}

class ItemManager{constructor(scene){this.scene=scene;this.items=[];this.exitPortal=null}
spawnItems(data,ts){this.clear();for(const sp of data.ammoSpawnPoints){const pos=new THREE.Vector3(sp.x*ts+ts/2,0,sp.y*ts+ts/2);this.items.push(new Item(this.scene,ITEM_TYPES.AMMO,pos,{amount:sp.amount}))}for(const sp of data.armorSpawnPoints){const pos=new THREE.Vector3(sp.x*ts+ts/2,0,sp.y*ts+ts/2);this.items.push(new Item(this.scene,ITEM_TYPES.ARMOR,pos,{value:sp.value}))}for(const sp of data.buffOrbSpawnPoints){const pos=new THREE.Vector3(sp.x*ts+ts/2,0,sp.y*ts+ts/2);this.items.push(new Item(this.scene,ITEM_TYPES.BUFF_ORB,pos))}if(data.exitPoint){const pos=new THREE.Vector3(data.exitPoint.x*ts+ts/2,0,data.exitPoint.y*ts+ts/2);this.exitPortal=new Item(this.scene,ITEM_TYPES.EXIT_PORTAL,pos);this.items.push(this.exitPortal)}}
update(dt,player){const collected=[];for(const i of this.items){i.update(dt);if(i.checkCollection(player.position)){if(i.type===ITEM_TYPES.EXIT_PORTAL){if(i.mesh.visible)collected.push(i)}else collected.push(i)}}return collected}
showExitPortal(){if(this.exitPortal)this.exitPortal.setVisible(true)}
clear(){for(const i of this.items)i.destroy();this.items=[];this.exitPortal=null}}

class UIManager{constructor(){this.healthFill=document.getElementById('health-fill');this.healthText=document.getElementById('health-text');this.armorFill=document.getElementById('armor-fill');this.ammoText=document.getElementById('ammo-text');this.levelText=document.getElementById('current-level');this.enemiesText=document.getElementById('enemies-count');this.buffsContainer=document.getElementById('buffs-container');this.msgContainer=document.getElementById('message-container');this.upgradeMenu=document.getElementById('upgrade-menu');this.upgradeOptions=document.getElementById('upgrade-options');this.superBuffMenu=document.getElementById('super-buff-menu');this.superBuffOptions=document.getElementById('super-buff-options');this.overlay=document.getElementById('screen-overlay');this.bossContainer=document.getElementById('boss-health-container');this.bossFill=document.getElementById('boss-health-fill');this.minimapCanvas=document.getElementById('minimap-canvas');this.minimapCtx=this.minimapCanvas.getContext('2d');this.minimapCanvas.width=150;this.minimapCanvas.height=150;this.buffs=[];this.superBuffs=[]}
updateHealth(c,m){this.healthFill.style.width=(c/m*100)+'%';this.healthText.textContent=c+'/'+m}
updateArmor(c,m){this.armorFill.style.width=(c/m*100)+'%';document.getElementById('armor-container').style.opacity=c>0?'1':'0.3'}
updateAmmo(c){this.ammoText.textContent=c;this.ammoText.style.color=c<=5?'#ff4444':c<=15?'#ffcc00':'#fff'}

showUpgradeMenu(cb){this.upgradeOptions.innerHTML='';for(const b of BUFF_TYPES){const d=document.createElement('div');d.className='upgrade-option';d.innerHTML='<div class="icon">'+b.icon+'</div><div class="name">'+b.name+'</div>';d.onclick=()=>{cb(b);this.upgradeMenu.style.display='none'};this.upgradeOptions.appendChild(d)}this.upgradeMenu.style.display='block';document.exitPointerLock()}

updateMinimap(data,pp,ts,enemies=[]){const ctx=this.minimapCtx,w=data.width,h=data.height,sc=Math.min(150/w,150/h);ctx.fillStyle='#111';ctx.fillRect(0,0,150,150);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const t=data.tiles[y][x];let c=null;if(t===TILE_TYPES.FLOOR)c='#444';else if(t===TILE_TYPES.WALL)c='#666';else if(t===TILE_TYPES.BOSS_ROOM)c='#633';if(c){ctx.fillStyle=c;ctx.fillRect(x*sc,y*sc,sc,sc)}}ctx.fillStyle='#f44';for(const e of enemies){if(!e.isAlive)continue;ctx.beginPath();ctx.arc(e.position.x/ts*sc,e.position.z/ts*sc,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#0f0';ctx.beginPath();ctx.arc(pp.x/ts*sc,pp.z/ts*sc,3,0,Math.PI*2);ctx.fill()}}

class CombatSystem{constructor(scene,player,em,cam){this.scene=scene;this.player=player;this.em=em;this.camera=cam;this.raycaster=new THREE.Raycaster();this.raycaster.far=100;this.effects=[]}
update(dt){this.effects=this.effects.filter(e=>e.update(dt))}
performRangedAttack(){const r=this.player.shoot();if(!r)return null;window.game?.weaponView?.playShoot();this.raycaster.setFromCamera(new THREE.Vector2(0,0),this.camera);const meshes=this.em.enemies.filter(e=>e.isAlive).map(e=>e.mesh);const ints=this.raycaster.intersectObjects(meshes,true);let hit=null,point=null;for(const e of this.em.enemies){if(!e.isAlive)continue;for(const i of ints){if(i.object===e.mesh||i.object.parent===e.mesh){hit=e;point=i.point;break}}if(hit)break}if(hit){const killed=hit.takeDamage(r.damage,r.isInstantKill);this.showHitMarker(r.isCrit,r.isInstantKill);if(r.chainLightning)this.chainLightning(hit,0.5,3);return{hit:true,killed}}return{hit:false}}
performMeleeAttack(){const r=this.player.melee();if(!r)return null;window.game?.weaponView?.playMelee();const pp=this.player.position.clone(),fwd=this.player.getForward();let hit=null,closest=3;for(const e of this.em.enemies){if(!e.isAlive)continue;const te=e.position.clone().sub(pp);const dist=te.length();if(dist>3)continue;te.normalize();if(fwd.dot(te)>0.5&&dist<closest){closest=dist;hit=e}}if(hit){const killed=hit.takeDamage(r.damage,r.isInstantKill);this.showHitMarker(r.isCrit,r.isInstantKill);return{hit:true,killed}}return{hit:false}}
chainLightning(src,dmg,max){const chained=[src];let pos=src.position.clone();for(let i=0;i<max;i++){let closest=null,dist=8;for(const e of this.em.enemies){if(!e.isAlive||chained.includes(e))continue;const d=e.position.distanceTo(pos);if(d<dist){dist=d;closest=e}}if(closest){this.createLightning(pos,closest.position.clone());closest.takeDamage(dmg);chained.push(closest);pos=closest.position.clone()}else break}}
createLightning(s,e){const pts=[];for(let i=0;i<=10;i++){const t=i/10,p=s.clone().lerp(e,t);if(i>0&&i<10){p.x+=Utils.randomFloat(-0.3,0.3);p.y+=Utils.randomFloat(-0.3,0.3);p.z+=Utils.randomFloat(-0.3,0.3)}pts.push(p)}const g=new THREE.BufferGeometry().setFromPoints(pts);const m=new THREE.LineBasicMaterial({color:0x00ffff,transparent:true,opacity:1});const l=new THREE.Line(g,m);this.scene.add(l);this.effects.push({mesh:l,age:0,update(dt){this.age+=dt;this.mesh.material.opacity=1-this.age/0.2;if(this.age>=0.2){this.mesh.parent?.remove(this.mesh);this.mesh.geometry.dispose();this.mesh.material.dispose();return false}return true}})}
showHitMarker(crit,ik){const hm=document.getElementById('hit-marker');hm.textContent=ik?'KILL!':crit?'CRIT!':'✕';hm.className=crit||ik?'critical':'';hm.style.opacity='1';setTimeout(()=>hm.style.opacity='0',200)}
clear(){for(const e of this.effects)if(e.mesh)this.scene.remove(e.mesh);this.effects=[]}}

// ===== GAME =====
class Game{constructor(){this.scene=null;this.camera=null;this.renderer=null;this.clock=null;this.isRunning=false;this.isPaused=false;this.currentLevel=1;this.enemiesKilled=0;this.dg=null;this.dm=null;this.player=null;this.weaponView=null;this.em=null;this.im=null;this.combat=null;this.ui=null;this.dungeonData=null;this.tileSize=4;this.boss=null;this.bossDefeated=false;this.update=this.update.bind(this)}
async init(){this.setupRenderer();this.setupScene();this.camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,100);this.clock=new THREE.Clock();this.dg=new DungeonGenerator(50,50);this.dm=new DungeonMeshGenerator(this.scene,this.tileSize);this.em=new EnemyManager(this.scene);this.em.init();this.im=new ItemManager(this.scene);this.ui=new UIManager();window.addEventListener('resize',()=>{this.camera.aspect=window.innerWidth/window.innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(window.innerWidth,window.innerHeight)});document.addEventListener('contextmenu',e=>e.preventDefault());window.game=this;await this.ui.showStartScreen();this.startNewGame()}
setupRenderer(){this.renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game-canvas'),antialias:true});this.renderer.setSize(window.innerWidth,window.innerHeight);this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2))}
setupScene(){this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x111111);this.scene.fog=new THREE.Fog(0x111111,10,40);this.scene.add(new THREE.AmbientLight(0x333333,0.5));this.scene.add(new THREE.HemisphereLight(0x666666,0x222222,0.3))}
startNewGame(){this.currentLevel=1;this.enemiesKilled=0;this.player=new Player(this.camera,this.scene);this.player.reset();this.weaponView=new WeaponView(this.scene,this.camera);this.combat=new CombatSystem(this.scene,this.player,this.em,this.camera);this.ui.clearBuffs();this.generateLevel();this.isRunning=true;this.update();document.getElementById('game-canvas').requestPointerLock()}
generateLevel(){this.dm.clear();this.em.clear();this.im.clear();this.combat.clear();this.dungeonData=this.dg.generate(this.currentLevel);this.dm.generate(this.dungeonData);this.player.spawn(this.dungeonData.spawnPoint.x,this.dungeonData.spawnPoint.y,this.tileSize);this.em.spawnEnemies(this.dungeonData.enemySpawnPoints,this.currentLevel);this.boss=this.em.spawnBoss(this.dungeonData.bossSpawnPoint,this.currentLevel);this.bossDefeated=false;this.im.spawnItems(this.dungeonData,this.tileSize);this.ui.updateLevel(this.currentLevel);this.ui.updateEnemyCount(this.em.getAliveCount());this.ui.showMessage('Уровень '+this.currentLevel,3000);this.updatePlayerUI()}
update(){if(!this.isRunning)return;requestAnimationFrame(this.update);const dt=Math.min(this.clock.getDelta(),0.1);if(this.isPaused)return;this.player.update(dt,this.dg,this.tileSize);this.weaponView.update(dt);this.em.update(dt,this.player,this.dg,this.tileSize,this.camera);this.combat.update(dt);const collected=this.im.update(dt,this.player);this.handleItems(collected);this.handleCombat();this.checkBoss();this.ui.updateEnemyCount(this.em.getAliveCount());this.ui.updateMinimap(this.dungeonData,this.player.position,this.tileSize,this.em.enemies);if(this.boss?.isAlive){const d=this.player.position.distanceTo(this.boss.position);this.ui.showBossHealth(d<20);if(d<20)this.ui.updateBossHealth(this.boss.health,this.boss.maxHealth)}else this.ui.showBossHealth(false);this.renderer.render(this.scene,this.camera)}
handleCombat(){if(this.player.mouse.left){const r=this.combat.performRangedAttack();if(r?.killed)this.enemiesKilled++;this.ui.updateAmmo(this.player.ammo)}if(this.player.mouse.right){const r=this.combat.performMeleeAttack();if(r?.killed)this.enemiesKilled++;this.player.mouse.right=false}}
handleItems(items){for(const i of items){if(i.type===ITEM_TYPES.AMMO){this.player.addAmmo(i.data.amount);this.ui.updateAmmo(this.player.ammo);this.ui.showMessage('+'+i.data.amount+' патронов',1500);i.collect()}else if(i.type===ITEM_TYPES.ARMOR){this.player.addArmor(i.data.value);this.ui.updateArmor(this.player.armor,this.player.maxArmor);this.ui.showMessage('+'+i.data.value+' брони',1500);i.collect()}else if(i.type===ITEM_TYPES.BUFF_ORB){this.isPaused=true;this.ui.showUpgradeMenu(b=>{this.player.applyBuff(b.id);this.ui.addBuff(b.id,b.name,b.icon);this.updatePlayerUI();this.isPaused=false;document.getElementById('game-canvas').requestPointerLock()});i.collect()}else if(i.type===ITEM_TYPES.EXIT_PORTAL&&this.bossDefeated){this.currentLevel++;this.generateLevel()}}}
checkBoss(){if(this.boss&&!this.boss.isAlive&&!this.bossDefeated){this.bossDefeated=true;this.enemiesKilled++;this.im.showExitPortal();this.isPaused=true;this.ui.showMessage('БОСС ПОВЕРЖЕН!',2000);setTimeout(()=>{this.ui.showSuperBuffMenu(b=>{this.player.applySuperBuff(b.id);this.ui.addSuperBuff(b.id,b.name,b.icon);this.ui.showMessage('Портал открыт!',2000);this.isPaused=false;document.getElementById('game-canvas').requestPointerLock()})},1000)}}
playerTakeDamage(amt){if(this.player.takeDamage(amt))this.gameOver();this.updatePlayerUI()}
updatePlayerUI(){this.ui.updateHealth(this.player.health,this.player.maxHealth);this.ui.updateArmor(this.player.armor,this.player.maxArmor);this.ui.updateAmmo(this.player.ammo)}
async gameOver(){this.isRunning=false;document.exitPointerLock();await this.ui.showDeathScreen(this.currentLevel,this.enemiesKilled);this.dm.clear();this.em.clear();this.im.clear();this.combat.clear();this.camera.remove(this.weaponView.group);this.player.reset();this.startNewGame()}}

document.addEventListener('DOMContentLoaded',()=>new Game().init());
    </script>
