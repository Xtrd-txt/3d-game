<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DUNGEON CRAWLER - Retro FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; image-rendering: pixelated; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; color: #00ff00; text-shadow: 2px 2px #003300; font-family: 'Courier New', monospace; }
        #level-info { position: absolute; top: 10px; left: 10px; font-size: 16px; }
        #health-bar { position: absolute; bottom: 20px; left: 20px; }
        #health-bar .bar { width: 200px; height: 20px; border: 2px solid #00ff00; background: #001100; }
        #health-bar .fill { height: 100%; background: #00ff00; transition: width 0.2s; }
        #health-bar .text { font-size: 14px; margin-top: 5px; }
        #armor-bar { position: absolute; bottom: 50px; left: 20px; }
        #armor-bar .bar { width: 150px; height: 15px; border: 2px solid #00aaff; background: #001122; }
        #armor-bar .fill { height: 100%; background: #00aaff; transition: width 0.2s; }
        #ammo-display { position: absolute; bottom: 20px; right: 20px; font-size: 32px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; font-size: 24px; }
        #message { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 28px; text-align: center; opacity: 0; transition: opacity 0.3s; }
        #message.show { opacity: 1; }
        #buffs { position: absolute; top: 10px; right: 10px; font-size: 12px; }
        .buff { background: #002200; border: 1px solid #00ff00; padding: 3px 8px; margin: 2px 0; }
        .buff.super { border-color: #ff00ff; color: #ff00ff; background: #220022; }
        #minimap { position: absolute; bottom: 80px; right: 20px; width: 120px; height: 120px; border: 2px solid #00ff00; background: rgba(0,20,0,0.8); }
        #boss-bar { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); width: 300px; display: none; text-align: center; }
        #boss-bar .bar { width: 100%; height: 20px; border: 2px solid #ff0000; background: #220000; }
        #boss-bar .fill { height: 100%; background: #ff0000; }
        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.1s; }
        #upgrade-menu, #super-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,20,0,0.95); border: 3px solid #00ff00; padding: 20px; display: none; pointer-events: auto; }
        #super-menu { border-color: #ff00ff; }
        .menu-title { font-size: 20px; text-align: center; margin-bottom: 15px; }
        #super-menu .menu-title { color: #ff00ff; }
        .menu-options { display: flex; gap: 10px; }
        .menu-option { background: #001100; border: 2px solid #00ff00; padding: 15px; cursor: pointer; text-align: center; min-width: 100px; }
        .menu-option:hover { background: #003300; }
        #super-menu .menu-option { border-color: #aa00aa; }
        #super-menu .menu-option:hover { background: #330033; }
        .option-icon { font-size: 28px; }
        .option-name { font-size: 12px; margin-top: 5px; }
        .option-desc { font-size: 10px; color: #888; margin-top: 3px; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; }
        #start-screen h1 { font-size: 48px; color: #00ff00; text-shadow: 0 0 20px #00ff00; margin-bottom: 10px; animation: flicker 2s infinite; }
        @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
        #start-screen .sub { color: #008800; margin-bottom: 30px; }
        #start-screen button { background: #001100; border: 3px solid #00ff00; color: #00ff00; padding: 15px 40px; font-size: 20px; cursor: pointer; font-family: 'Courier New'; }
        #start-screen button:hover { background: #003300; }
        #start-screen .controls { margin-top: 30px; font-size: 12px; color: #006600; }
        #weapon-view { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); pointer-events: none; image-rendering: pixelated; }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="game"></canvas>
    <div id="hud">
        <div id="level-info">УРОВЕНЬ: <span id="level">1</span> | ВРАГИ: <span id="enemies">0</span></div>
        <div id="buffs"></div>
        <div id="crosshair">+</div>
        <div id="health-bar"><div class="bar"><div class="fill" id="hp-fill"></div></div><div class="text">HP: <span id="hp-text">3/3</span></div></div>
        <div id="armor-bar"><div class="bar"><div class="fill" id="armor-fill"></div></div></div>
        <div id="ammo-display">🔫 <span id="ammo">30</span></div>
        <canvas id="minimap"></canvas>
        <div id="boss-bar"><div class="bar"><div class="fill" id="boss-fill"></div></div><div>БОСС</div></div>
        <div id="message"></div>
        <div id="damage-flash"></div>
        <div id="upgrade-menu"><div class="menu-title">ВЫБЕРИ УЛУЧШЕНИЕ</div><div class="menu-options" id="upgrade-options"></div></div>
        <div id="super-menu"><div class="menu-title">⚡ СУПЕР СИЛА ⚡</div><div class="menu-options" id="super-options"></div></div>
        <div id="start-screen"><h1>DUNGEON CRAWLER</h1><div class="sub">РЕТРО ШУТЕР</div><button id="start-btn">► НАЧАТЬ</button><div class="controls">WASD - движение | МЫШЬ - обзор<br>ЛКМ - стрелять | ПКМ - удар</div></div>
    </div>
    <canvas id="weapon-view" width="320" height="200"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========== RETRO DOOM-STYLE FPS ==========
const CONFIG = {
    tileSize: 4,
    renderScale: 0.5, // Lower = more pixelated
    fov: 90,
    shotgunPellets: 6,
    shotgunSpread: 0.15,
    shotgunRange: 5,
    meleeRange: 2,
    enemyMeleeRange: 1,
    enemyRangedRange: 5
};

// Color palette (green-black retro style)
const COLORS = {
    primary: 0x00ff00,
    dark: 0x003300,
    floor: 0x111111,
    ceiling: 0x050505,
    wall: 0x1a1a1a,
    wallLight: 0x2a2a2a,
    enemy: 0x00ff00,
    blood: 0x00ff00
};

// ========== TEXTURE GENERATOR ==========
function generateTexture(width, height, drawFn) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    drawFn(ctx, width, height);
    return new THREE.CanvasTexture(canvas);
}

function createWallTexture() {
    return generateTexture(64, 64, (ctx, w, h) => {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#0a0a0a';
        for (let y = 0; y < h; y += 8) {
            for (let x = 0; x < w; x += 16) {
                const offset = (y % 16 === 0) ? 0 : 8;
                ctx.fillRect(x + offset, y, 15, 7);
            }
        }
        ctx.fillStyle = '#00ff00';
        ctx.globalAlpha = 0.1;
        for (let i = 0; i < 20; i++) {
            ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }
        ctx.globalAlpha = 1;
    });
}

function createFloorTexture() {
    return generateTexture(64, 64, (ctx, w, h) => {
        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#0a0a0a';
        for (let y = 0; y < h; y += 8) {
            for (let x = 0; x < w; x += 8) {
                if ((x + y) % 16 === 0) ctx.fillRect(x, y, 8, 8);
            }
        }
        ctx.fillStyle = '#00ff00';
        ctx.globalAlpha = 0.05;
        for (let i = 0; i < 10; i++) {
            ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
        }
    });
}

function createCeilingTexture() {
    return generateTexture(64, 64, (ctx, w, h) => {
        ctx.fillStyle = '#080808';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#00ff00';
        ctx.globalAlpha = 0.03;
        for (let i = 0; i < 5; i++) {
            ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
        }
    });
}

// ========== SPRITE GENERATOR ==========
function createEnemySprite(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    ctx.imageSmoothingEnabled = false;

    const colors = {
        basic: { body: '#00ff00', eye: '#ff0000' },
        fast: { body: '#00ffaa', eye: '#ffff00' },
        tank: { body: '#008800', eye: '#ff0000' },
        ranged: { body: '#00ff88', eye: '#ff00ff' },
        boss: { body: '#ff0000', eye: '#ffff00' }
    };

    const c = colors[type] || colors.basic;

    if (type === 'boss') {
        // Big demon boss
        ctx.fillStyle = c.body;
        ctx.fillRect(16, 8, 32, 48); // Body
        ctx.fillRect(8, 16, 8, 32); // Left arm
        ctx.fillRect(48, 16, 8, 32); // Right arm
        ctx.fillStyle = '#aa0000';
        ctx.fillRect(20, 0, 8, 12); // Left horn
        ctx.fillRect(36, 0, 8, 12); // Right horn
        ctx.fillStyle = c.eye;
        ctx.fillRect(22, 18, 6, 6); // Left eye
        ctx.fillRect(36, 18, 6, 6); // Right eye
        ctx.fillStyle = '#000';
        ctx.fillRect(24, 20, 2, 2);
        ctx.fillRect(38, 20, 2, 2);
        ctx.fillStyle = '#880000';
        ctx.fillRect(26, 32, 12, 8); // Mouth
    } else if (type === 'tank') {
        // Heavy armored
        ctx.fillStyle = c.body;
        ctx.fillRect(12, 12, 40, 44);
        ctx.fillStyle = '#004400';
        ctx.fillRect(16, 16, 32, 20); // Armor
        ctx.fillStyle = c.eye;
        ctx.fillRect(22, 22, 6, 4);
        ctx.fillRect(36, 22, 6, 4);
    } else if (type === 'fast') {
        // Thin fast enemy
        ctx.fillStyle = c.body;
        ctx.fillRect(24, 8, 16, 48);
        ctx.fillRect(16, 24, 8, 16);
        ctx.fillRect(40, 24, 8, 16);
        ctx.fillStyle = c.eye;
        ctx.fillRect(26, 14, 4, 4);
        ctx.fillRect(34, 14, 4, 4);
    } else if (type === 'ranged') {
        // Floating eye type
        ctx.fillStyle = c.body;
        ctx.beginPath();
        ctx.arc(32, 32, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c.eye;
        ctx.fillRect(24, 26, 16, 12);
        ctx.fillStyle = '#000';
        ctx.fillRect(30, 30, 4, 4);
    } else {
        // Basic zombie
        ctx.fillStyle = c.body;
        ctx.fillRect(20, 8, 24, 48);
        ctx.fillRect(12, 20, 8, 24);
        ctx.fillRect(44, 20, 8, 24);
        ctx.fillStyle = c.eye;
        ctx.fillRect(24, 16, 5, 5);
        ctx.fillRect(35, 16, 5, 5);
        ctx.fillStyle = '#000';
        ctx.fillRect(26, 18, 2, 2);
        ctx.fillRect(37, 18, 2, 2);
        ctx.fillStyle = '#008800';
        ctx.fillRect(28, 28, 8, 4); // Mouth
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
}

function createItemSprite(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    if (type === 'ammo') {
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(8, 12, 16, 12);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(10, 6, 4, 8);
        ctx.fillRect(14, 6, 4, 8);
        ctx.fillRect(18, 6, 4, 8);
    } else if (type === 'armor') {
        ctx.fillStyle = '#00aaff';
        ctx.fillRect(8, 8, 16, 20);
        ctx.fillStyle = '#0066aa';
        ctx.fillRect(12, 12, 8, 12);
    } else if (type === 'buff') {
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(16, 16, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(16, 16, 8, 0, Math.PI * 2);
        ctx.fill();
    } else if (type === 'portal') {
        ctx.fillStyle = '#00ff00';
        ctx.beginPath();
        ctx.arc(16, 16, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(16, 16, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#00ff00';
        ctx.beginPath();
        ctx.arc(16, 16, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
}

// ========== WEAPON RENDERER ==========
class WeaponRenderer {
    constructor() {
        this.canvas = document.getElementById('weapon-view');
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;

        this.offsetX = 0;
        this.offsetY = 0;
        this.recoil = 0;
        this.shake = 0;
        this.swinging = false;
        this.swingFrame = 0;

        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        const scale = Math.min(window.innerWidth / 320, window.innerHeight / 200);
        this.canvas.style.width = (320 * scale) + 'px';
        this.canvas.style.height = (200 * scale) + 'px';
    }

    update(dt) {
        if (this.recoil > 0) {
            this.recoil -= dt * 8;
            if (this.recoil < 0) this.recoil = 0;
        }
        if (this.shake > 0) {
            this.shake -= dt * 10;
            this.offsetX = (Math.random() - 0.5) * this.shake * 10;
            this.offsetY = (Math.random() - 0.5) * this.shake * 10;
            if (this.shake < 0) {
                this.shake = 0;
                this.offsetX = 0;
                this.offsetY = 0;
            }
        }
        if (this.swinging) {
            this.swingFrame += dt * 20;
            if (this.swingFrame > 4) {
                this.swinging = false;
                this.swingFrame = 0;
            }
        }
    }

    render(showFist = false) {
        const ctx = this.ctx;
        const w = 320, h = 200;
        ctx.clearRect(0, 0, w, h);

        const bobX = this.offsetX;
        const bobY = this.offsetY + this.recoil * 20;

        if (showFist || this.swinging) {
            // Draw fist (left side) - green pixelated
            const fistX = 40 + bobX + (this.swinging ? Math.sin(this.swingFrame * 2) * 40 : 0);
            const fistY = h - 80 + bobY - (this.swinging ? Math.abs(Math.sin(this.swingFrame * 2)) * 30 : 0);

            ctx.fillStyle = '#00aa00';
            ctx.fillRect(fistX, fistY, 40, 50);
            ctx.fillStyle = '#008800';
            ctx.fillRect(fistX + 5, fistY + 5, 30, 15);
            ctx.fillRect(fistX + 5, fistY + 22, 30, 8);
            ctx.fillRect(fistX + 5, fistY + 32, 30, 8);
            ctx.fillRect(fistX + 5, fistY + 42, 30, 8);
            ctx.fillStyle = '#006600';
            ctx.fillRect(fistX, fistY + 50, 40, 10);
        }

        // Draw shotgun (right side) - green pixelated style
        const gunX = w - 120 + bobX;
        const gunY = h - 100 + bobY;

        // Barrel
        ctx.fillStyle = '#00aa00';
        ctx.fillRect(gunX + 20, gunY - 40, 12, 60);
        ctx.fillRect(gunX + 34, gunY - 40, 12, 60);

        // Body
        ctx.fillStyle = '#008800';
        ctx.fillRect(gunX, gunY + 20, 80, 30);
        ctx.fillRect(gunX + 10, gunY + 50, 60, 40);

        // Details
        ctx.fillStyle = '#006600';
        ctx.fillRect(gunX + 15, gunY + 25, 50, 5);
        ctx.fillRect(gunX + 20, gunY + 55, 40, 10);

        // Muzzle flash when shooting
        if (this.recoil > 0.5) {
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(gunX + 18, gunY - 60, 20, 20);
            ctx.fillStyle = '#ff8800';
            ctx.fillRect(gunX + 22, gunY - 55, 12, 12);
        }
    }

    shoot() {
        this.recoil = 1;
        this.shake = 1;
    }

    punch() {
        this.swinging = true;
        this.swingFrame = 0;
        this.shake = 0.5;
    }
}

// ========== DUNGEON GENERATOR ==========
const TILE = { EMPTY: 0, FLOOR: 1, WALL: 2, BOSS: 3 };

class Dungeon {
    constructor(w = 40, h = 40) {
        this.width = w;
        this.height = h;
        this.tiles = [];
        this.rooms = [];
        this.spawn = null;
        this.exit = null;
        this.bossPos = null;
        this.enemySpawns = [];
        this.itemSpawns = [];
    }

    generate(level) {
        // Init empty
        this.tiles = Array(this.height).fill(null).map(() => Array(this.width).fill(TILE.EMPTY));
        this.rooms = [];
        this.enemySpawns = [];
        this.itemSpawns = [];

        // Generate rooms
        const roomCount = 5 + Math.floor(level / 2);
        for (let i = 0; i < 200 && this.rooms.length < roomCount; i++) {
            const rw = 5 + Math.floor(Math.random() * 6);
            const rh = 5 + Math.floor(Math.random() * 6);
            const rx = 2 + Math.floor(Math.random() * (this.width - rw - 4));
            const ry = 2 + Math.floor(Math.random() * (this.height - rh - 4));

            let ok = true;
            for (const r of this.rooms) {
                if (rx < r.x + r.w + 2 && rx + rw + 2 > r.x && ry < r.y + r.h + 2 && ry + rh + 2 > r.y) {
                    ok = false;
                    break;
                }
            }
            if (ok) {
                this.rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: Math.floor(rx + rw/2), cy: Math.floor(ry + rh/2) });
                for (let y = ry; y < ry + rh; y++)
                    for (let x = rx; x < rx + rw; x++)
                        this.tiles[y][x] = TILE.FLOOR;
            }
        }

        // Boss room
        const bw = 10 + Math.floor(Math.random() * 4);
        const bh = 10 + Math.floor(Math.random() * 4);
        for (let i = 0; i < 200; i++) {
            const bx = 2 + Math.floor(Math.random() * (this.width - bw - 4));
            const by = 2 + Math.floor(Math.random() * (this.height - bh - 4));
            let ok = true;
            for (const r of this.rooms) {
                if (bx < r.x + r.w + 3 && bx + bw + 3 > r.x && by < r.y + r.h + 3 && by + bh + 3 > r.y) {
                    ok = false;
                    break;
                }
            }
            if (ok) {
                const bossRoom = { x: bx, y: by, w: bw, h: bh, cx: Math.floor(bx + bw/2), cy: Math.floor(by + bh/2), isBoss: true };
                this.rooms.push(bossRoom);
                for (let y = by; y < by + bh; y++)
                    for (let x = bx; x < bx + bw; x++)
                        this.tiles[y][x] = TILE.BOSS;
                this.bossPos = { x: bossRoom.cx, y: bossRoom.cy };
                break;
            }
        }

        // Connect rooms
        for (let i = 1; i < this.rooms.length; i++) {
            const a = this.rooms[i - 1];
            const b = this.rooms[i];
            let x = a.cx, y = a.cy;
            while (x !== b.cx) {
                if (this.tiles[y][x] === TILE.EMPTY) this.tiles[y][x] = TILE.FLOOR;
                x += x < b.cx ? 1 : -1;
            }
            while (y !== b.cy) {
                if (this.tiles[y][x] === TILE.EMPTY) this.tiles[y][x] = TILE.FLOOR;
                y += y < b.cy ? 1 : -1;
            }
        }

        // Add walls
        for (let y = 0; y < this.height; y++) {
            for (let x = 0; x < this.width; x++) {
                if (this.tiles[y][x] === TILE.EMPTY) {
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            const ny = y + dy, nx = x + dx;
                            if (ny >= 0 && ny < this.height && nx >= 0 && nx < this.width) {
                                if (this.tiles[ny][nx] === TILE.FLOOR || this.tiles[ny][nx] === TILE.BOSS) {
                                    this.tiles[y][x] = TILE.WALL;
                                }
                            }
                        }
                    }
                }
            }
        }

        // Set spawn (furthest from boss)
        let maxDist = 0;
        for (const r of this.rooms) {
            if (r.isBoss) continue;
            const d = Math.hypot(r.cx - this.bossPos.x, r.cy - this.bossPos.y);
            if (d > maxDist) {
                maxDist = d;
                this.spawn = { x: r.cx, y: r.cy };
            }
        }
        this.exit = { x: this.bossPos.x + 2, y: this.bossPos.y + 2 };

        // Enemy spawns
        for (const r of this.rooms) {
            if (r.isBoss) continue;
            const isSpawn = r.cx === this.spawn.x && r.cy === this.spawn.y;
            const count = isSpawn ? 0 : 1 + Math.floor(Math.random() * (2 + Math.floor(level / 2)));
            for (let i = 0; i < count; i++) {
                this.enemySpawns.push({
                    x: r.x + 1 + Math.floor(Math.random() * (r.w - 2)),
                    y: r.y + 1 + Math.floor(Math.random() * (r.h - 2))
                });
            }
        }

        // Item spawns
        const nonBossRooms = this.rooms.filter(r => !r.isBoss);
        // Ammo (3-5)
        for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
            const r = nonBossRooms[Math.floor(Math.random() * nonBossRooms.length)];
            this.itemSpawns.push({ type: 'ammo', x: r.cx + Math.floor(Math.random() * 3) - 1, y: r.cy + Math.floor(Math.random() * 3) - 1, amount: 5 + Math.floor(Math.random() * 6) });
        }
        // Armor (0-2)
        for (let i = 0; i < Math.floor(Math.random() * 3); i++) {
            const r = nonBossRooms[Math.floor(Math.random() * nonBossRooms.length)];
            this.itemSpawns.push({ type: 'armor', x: r.cx, y: r.cy, value: 1 + Math.floor(Math.random() * 3) });
        }
        // Buff orbs (1-2)
        for (let i = 0; i < 1 + Math.floor(Math.random() * 2); i++) {
            const r = nonBossRooms[i % nonBossRooms.length];
            this.itemSpawns.push({ type: 'buff', x: r.cx, y: r.cy });
        }

        return this;
    }

    isWalkable(x, y) {
        const tx = Math.floor(x), ty = Math.floor(y);
        if (ty < 0 || ty >= this.height || tx < 0 || tx >= this.width) return false;
        const t = this.tiles[ty][tx];
        return t === TILE.FLOOR || t === TILE.BOSS;
    }
}

// ========== GAME CLASS ==========
class Game {
    constructor() {
        this.canvas = document.getElementById('game');
        this.running = false;
        this.paused = false;
        this.level = 1;
        this.kills = 0;

        // Three.js
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.clock = new THREE.Clock();

        // Game objects
        this.dungeon = new Dungeon();
        this.player = null;
        this.enemies = [];
        this.items = [];
        this.projectiles = [];
        this.boss = null;
        this.bossDefeated = false;
        this.exitPortal = null;

        // Textures
        this.textures = {};
        this.sprites = {};

        // Weapon
        this.weapon = new WeaponRenderer();

        // Input
        this.keys = {};
        this.mouse = { x: 0, y: 0, left: false, right: false };
        this.yaw = 0;
        this.pitch = 0;

        this.setupInput();
    }

    setupInput() {
        document.addEventListener('keydown', e => this.keys[e.code] = true);
        document.addEventListener('keyup', e => this.keys[e.code] = false);
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement) {
                this.yaw -= e.movementX * 0.002;
                this.pitch -= e.movementY * 0.002;
                this.pitch = Math.max(-1.4, Math.min(1.4, this.pitch));
            }
        });
        document.addEventListener('mousedown', e => {
            if (e.button === 0) this.mouse.left = true;
            if (e.button === 2) this.mouse.right = true;
        });
        document.addEventListener('mouseup', e => {
            if (e.button === 0) this.mouse.left = false;
            if (e.button === 2) this.mouse.right = false;
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
        this.canvas.addEventListener('click', () => {
            if (this.running && !this.paused) this.canvas.requestPointerLock();
        });

        document.getElementById('start-btn').onclick = () => this.start();
    }

    init() {
        // Renderer
        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: false });
        this.renderer.setPixelRatio(CONFIG.renderScale);
        this.renderer.setSize(window.innerWidth, window.innerHeight);

        // Scene
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x000000);
        this.scene.fog = new THREE.Fog(0x000000, 5, 25);

        // Camera
        this.camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, 0.1, 100);

        // Lights
        this.scene.add(new THREE.AmbientLight(0x00ff00, 0.15));

        // Textures
        this.textures.wall = createWallTexture();
        this.textures.floor = createFloorTexture();
        this.textures.ceiling = createCeilingTexture();
        this.textures.wall.wrapS = this.textures.wall.wrapT = THREE.RepeatWrapping;
        this.textures.floor.wrapS = this.textures.floor.wrapT = THREE.RepeatWrapping;

        // Sprites
        this.sprites.basic = createEnemySprite('basic');
        this.sprites.fast = createEnemySprite('fast');
        this.sprites.tank = createEnemySprite('tank');
        this.sprites.ranged = createEnemySprite('ranged');
        this.sprites.boss = createEnemySprite('boss');
        this.sprites.ammo = createItemSprite('ammo');
        this.sprites.armor = createItemSprite('armor');
        this.sprites.buff = createItemSprite('buff');
        this.sprites.portal = createItemSprite('portal');

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.game = this;
    }

    start() {
        document.getElementById('start-screen').style.display = 'none';
        this.init();
        this.level = 1;
        this.kills = 0;
        this.resetPlayer();
        this.generateLevel();
        this.running = true;
        this.canvas.requestPointerLock();
        this.update();
    }

    resetPlayer() {
        this.player = {
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            hp: 3, maxHp: 3,
            armor: 0, maxArmor: 10,
            ammo: 30, maxAmmo: 100,
            speed: 8,
            lastShot: 0, lastMelee: 0,
            fireRate: 1,
            meleeDmg: 2, rangedDmg: 1,
            critChance: 0.15,
            buffs: { hp: 0, fireRate: 0, meleeDmg: 0, rangedDmg: 0 },
            superBuffs: { chainLightning: false, ricochet: false, bunnyHop: false, instantKill: false }
        };
        this.yaw = 0;
        this.pitch = 0;
    }

    generateLevel() {
        // Clear old
        while (this.scene.children.length > 0) this.scene.remove(this.scene.children[0]);
        this.enemies = [];
        this.items = [];
        this.projectiles = [];
        this.boss = null;
        this.bossDefeated = false;
        this.exitPortal = null;

        // Add lights
        this.scene.add(new THREE.AmbientLight(0x00ff00, 0.15));

        // Generate dungeon
        this.dungeon.generate(this.level);

        // Build mesh
        this.buildDungeonMesh();

        // Player spawn
        this.player.pos.set(
            this.dungeon.spawn.x * CONFIG.tileSize + CONFIG.tileSize / 2,
            1.7,
            this.dungeon.spawn.y * CONFIG.tileSize + CONFIG.tileSize / 2
        );

        // Spawn enemies
        const types = ['basic', 'basic', 'fast', 'tank', 'ranged'];
        for (const sp of this.dungeon.enemySpawns) {
            const type = types[Math.floor(Math.random() * types.length)];
            this.spawnEnemy(sp.x, sp.y, type);
        }

        // Spawn boss
        this.boss = this.spawnEnemy(this.dungeon.bossPos.x, this.dungeon.bossPos.y, 'boss');

        // Spawn items
        for (const it of this.dungeon.itemSpawns) {
            this.spawnItem(it.x, it.y, it.type, it);
        }

        // UI
        this.updateUI();
        this.showMessage('УРОВЕНЬ ' + this.level, 2000);
    }

    buildDungeonMesh() {
        const ts = CONFIG.tileSize;
        const wallMat = new THREE.MeshLambertMaterial({ map: this.textures.wall });
        const floorMat = new THREE.MeshLambertMaterial({ map: this.textures.floor });
        const ceilMat = new THREE.MeshLambertMaterial({ map: this.textures.ceiling });
        const bossMat = new THREE.MeshLambertMaterial({ color: 0x220000, map: this.textures.floor });

        for (let y = 0; y < this.dungeon.height; y++) {
            for (let x = 0; x < this.dungeon.width; x++) {
                const t = this.dungeon.tiles[y][x];
                const wx = x * ts, wz = y * ts;

                if (t === TILE.FLOOR || t === TILE.BOSS) {
                    // Floor
                    const fg = new THREE.PlaneGeometry(ts, ts);
                    const fm = new THREE.Mesh(fg, t === TILE.BOSS ? bossMat : floorMat);
                    fm.rotation.x = -Math.PI / 2;
                    fm.position.set(wx, 0, wz);
                    this.scene.add(fm);

                    // Ceiling
                    const cg = new THREE.PlaneGeometry(ts, ts);
                    const cm = new THREE.Mesh(cg, ceilMat);
                    cm.rotation.x = Math.PI / 2;
                    cm.position.set(wx, 4, wz);
                    this.scene.add(cm);

                    // Point light in rooms
                    if (Math.random() < 0.05) {
                        const light = new THREE.PointLight(t === TILE.BOSS ? 0xff0000 : 0x00ff00, 0.5, ts * 4);
                        light.position.set(wx, 3, wz);
                        this.scene.add(light);
                    }
                } else if (t === TILE.WALL) {
                    const wg = new THREE.BoxGeometry(ts, 4, ts);
                    const wm = new THREE.Mesh(wg, wallMat);
                    wm.position.set(wx, 2, wz);
                    this.scene.add(wm);
                }
            }
        }
    }

    spawnEnemy(tx, ty, type) {
        const ts = CONFIG.tileSize;
        const baseHp = 3 + (this.level - 1);

        const stats = {
            basic: { hp: baseHp, speed: 3, dmg: 1, size: 1, range: CONFIG.enemyMeleeRange },
            fast: { hp: Math.max(1, baseHp - 1), speed: 6, dmg: 1, size: 0.8, range: CONFIG.enemyMeleeRange },
            tank: { hp: baseHp + 3, speed: 1.5, dmg: 2, size: 1.4, range: CONFIG.enemyMeleeRange },
            ranged: { hp: Math.max(1, baseHp - 1), speed: 2, dmg: 1, size: 0.9, range: CONFIG.enemyRangedRange, isRanged: true },
            boss: { hp: baseHp * 5, speed: 2.5, dmg: 2, size: 2.5, range: 2 }
        };

        const s = stats[type];
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.sprites[type], transparent: true }));
        sprite.scale.set(s.size * 2, s.size * 2, 1);
        sprite.position.set(tx * ts + ts / 2, s.size, ty * ts + ts / 2);
        this.scene.add(sprite);

        const enemy = {
            sprite,
            type,
            pos: sprite.position.clone(),
            hp: s.hp,
            maxHp: s.hp,
            speed: s.speed,
            dmg: s.dmg,
            size: s.size,
            range: s.range,
            isRanged: s.isRanged || false,
            alive: true,
            attackCd: 0,
            state: 'idle',
            target: null
        };

        this.enemies.push(enemy);
        return enemy;
    }

    spawnItem(tx, ty, type, data = {}) {
        const ts = CONFIG.tileSize;
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: this.sprites[type] || this.sprites.buff, transparent: true }));
        sprite.scale.set(1, 1, 1);
        sprite.position.set(tx * ts + ts / 2, 0.7, ty * ts + ts / 2);
        this.scene.add(sprite);

        const item = { sprite, type, pos: sprite.position.clone(), data, collected: false };
        this.items.push(item);
        return item;
    }

    update() {
        if (!this.running) return;
        requestAnimationFrame(() => this.update());

        const dt = Math.min(this.clock.getDelta(), 0.1);

        if (this.paused) {
            this.renderer.render(this.scene, this.camera);
            return;
        }

        this.updatePlayer(dt);
        this.updateEnemies(dt);
        this.updateProjectiles(dt);
        this.updateItems(dt);
        this.checkBoss();
        this.handleCombat(dt);

        this.weapon.update(dt);
        this.weapon.render(this.mouse.right);

        this.updateCamera();
        this.updateMinimap();
        this.updateUI();

        this.renderer.render(this.scene, this.camera);
    }

    updatePlayer(dt) {
        const p = this.player;

        // Movement
        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

        const dir = new THREE.Vector3();
        if (this.keys['KeyW']) dir.add(fwd);
        if (this.keys['KeyS']) dir.sub(fwd);
        if (this.keys['KeyA']) dir.sub(right);
        if (this.keys['KeyD']) dir.add(right);
        if (dir.length() > 0) dir.normalize();

        const newPos = p.pos.clone().add(dir.multiplyScalar(p.speed * dt));

        // Collision
        const ts = CONFIG.tileSize;
        if (this.dungeon.isWalkable(newPos.x / ts, p.pos.z / ts)) p.pos.x = newPos.x;
        if (this.dungeon.isWalkable(p.pos.x / ts, newPos.z / ts)) p.pos.z = newPos.z;
    }

    updateCamera() {
        this.camera.position.copy(this.player.pos);
        this.camera.position.y += this.weapon.offsetY * 0.01;
        this.camera.rotation.order = 'YXZ';
        this.camera.rotation.y = this.yaw;
        this.camera.rotation.x = this.pitch;
    }

    handleCombat(dt) {
        const now = performance.now() / 1000;
        const p = this.player;

        // Shooting (shotgun)
        if (this.mouse.left && p.ammo > 0 && now - p.lastShot >= 1 / (p.fireRate + p.buffs.fireRate)) {
            p.lastShot = now;
            p.ammo--;
            this.weapon.shoot();

            // Fire pellets
            const origin = p.pos.clone();
            const baseDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

            for (let i = 0; i < CONFIG.shotgunPellets; i++) {
                const spread = CONFIG.shotgunSpread;
                const dir = baseDir.clone();
                dir.x += (Math.random() - 0.5) * spread;
                dir.y += (Math.random() - 0.5) * spread * 0.5;
                dir.z += (Math.random() - 0.5) * spread;
                dir.normalize();

                this.projectiles.push({
                    pos: origin.clone(),
                    dir: dir,
                    speed: 30,
                    dist: 0,
                    maxDist: CONFIG.shotgunRange,
                    dmg: p.rangedDmg + p.buffs.rangedDmg,
                    isPlayer: true,
                    crit: Math.random() < p.critChance,
                    chain: p.superBuffs.chainLightning,
                    ricochet: p.superBuffs.ricochet ? 2 : 0,
                    instakill: p.superBuffs.instantKill && Math.random() < 0.05
                });
            }
        }

        // Melee
        if (this.mouse.right && now - p.lastMelee >= 0.5) {
            p.lastMelee = now;
            this.weapon.punch();
            this.mouse.right = false;

            const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.yaw);

            for (const e of this.enemies) {
                if (!e.alive) continue;
                const toE = e.pos.clone().sub(p.pos);
                const dist = toE.length();
                if (dist > CONFIG.meleeRange) continue;

                toE.normalize();
                if (fwd.dot(toE) > 0.5) {
                    let dmg = p.meleeDmg + p.buffs.meleeDmg;
                    const crit = Math.random() < p.critChance;
                    if (crit) dmg = 5;
                    const ik = p.superBuffs.instantKill && Math.random() < 0.05;

                    this.damageEnemy(e, dmg, crit, ik);
                    break;
                }
            }
        }
    }

    updateProjectiles(dt) {
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const proj = this.projectiles[i];
            const move = proj.dir.clone().multiplyScalar(proj.speed * dt);
            proj.pos.add(move);
            proj.dist += move.length();

            // Check max distance
            if (proj.dist >= proj.maxDist) {
                this.projectiles.splice(i, 1);
                continue;
            }

            // Check wall collision
            const ts = CONFIG.tileSize;
            if (!this.dungeon.isWalkable(proj.pos.x / ts, proj.pos.z / ts)) {
                if (proj.ricochet > 0) {
                    proj.ricochet--;
                    proj.dir.x *= -1;
                    proj.dir.z *= -1;
                    proj.dist = 0;
                } else {
                    this.projectiles.splice(i, 1);
                }
                continue;
            }

            // Check enemy hit (player projectiles)
            if (proj.isPlayer) {
                for (const e of this.enemies) {
                    if (!e.alive) continue;
                    if (proj.pos.distanceTo(e.pos) < e.size) {
                        this.damageEnemy(e, proj.dmg, proj.crit, proj.instakill);

                        // Chain lightning
                        if (proj.chain) {
                            this.chainLightning(e, 0.5, 3);
                        }

                        // Ricochet to next enemy
                        if (proj.ricochet > 0) {
                            const next = this.findNearestEnemy(proj.pos, e, 8);
                            if (next) {
                                proj.dir = next.pos.clone().sub(proj.pos).normalize();
                                proj.ricochet--;
                                proj.dist = 0;
                                continue;
                            }
                        }

                        this.projectiles.splice(i, 1);
                        break;
                    }
                }
            } else {
                // Enemy projectile hits player
                if (proj.pos.distanceTo(this.player.pos) < 0.8) {
                    this.playerTakeDamage(proj.dmg);
                    this.projectiles.splice(i, 1);
                }
            }
        }
    }

    chainLightning(source, dmg, count) {
        const hit = [source];
        let current = source;

        for (let i = 0; i < count; i++) {
            const next = this.findNearestEnemy(current.pos, current, 6, hit);
            if (!next) break;
            this.damageEnemy(next, dmg, false, false);
            hit.push(next);
            current = next;
        }
    }

    findNearestEnemy(pos, exclude, range, excludeList = []) {
        let nearest = null, minDist = range;
        for (const e of this.enemies) {
            if (!e.alive || e === exclude || excludeList.includes(e)) continue;
            const d = pos.distanceTo(e.pos);
            if (d < minDist) {
                minDist = d;
                nearest = e;
            }
        }
        return nearest;
    }

    damageEnemy(e, dmg, crit, instakill) {
        if (instakill) e.hp = 0;
        else e.hp -= dmg;

        if (e.hp <= 0) {
            e.alive = false;
            this.scene.remove(e.sprite);
            this.kills++;
        }
    }

    updateEnemies(dt) {
        const ts = CONFIG.tileSize;

        for (const e of this.enemies) {
            if (!e.alive) continue;

            const dist = e.pos.distanceTo(this.player.pos);

            // Detection
            if (dist < 15) e.target = this.player;

            if (e.target) {
                // Attack cooldown
                if (e.attackCd > 0) e.attackCd -= dt;

                // In range - attack
                if (dist < e.range + 0.5) {
                    if (e.attackCd <= 0) {
                        e.attackCd = 1;
                        if (e.isRanged) {
                            // Shoot
                            const dir = this.player.pos.clone().sub(e.pos).normalize();
                            this.projectiles.push({
                                pos: e.pos.clone(),
                                dir: dir,
                                speed: 10,
                                dist: 0,
                                maxDist: 20,
                                dmg: e.dmg,
                                isPlayer: false
                            });
                        } else {
                            // Melee
                            this.playerTakeDamage(e.dmg);
                        }
                    }
                } else {
                    // Move towards player
                    const dir = this.player.pos.clone().sub(e.pos);
                    dir.y = 0;
                    dir.normalize();

                    const newPos = e.pos.clone().add(dir.multiplyScalar(e.speed * dt));
                    if (this.dungeon.isWalkable(newPos.x / ts, newPos.z / ts)) {
                        e.pos.copy(newPos);
                        e.sprite.position.copy(e.pos);
                        e.sprite.position.y = e.size;
                    }
                }
            }

            // Face camera (billboard)
            e.sprite.material.rotation = 0;
        }
    }

    updateItems(dt) {
        for (let i = this.items.length - 1; i >= 0; i--) {
            const it = this.items[i];
            if (it.collected) continue;

            // Bob animation
            it.sprite.position.y = 0.7 + Math.sin(performance.now() / 500 + i) * 0.1;

            // Collection check
            if (this.player.pos.distanceTo(it.pos) < 1.5) {
                if (it.type === 'portal') {
                    if (this.bossDefeated) {
                        this.level++;
                        this.generateLevel();
                    }
                    continue;
                }

                this.collectItem(it);
                it.collected = true;
                this.scene.remove(it.sprite);
                this.items.splice(i, 1);
            }
        }
    }

    collectItem(it) {
        const p = this.player;

        if (it.type === 'ammo') {
            p.ammo = Math.min(p.ammo + (it.data.amount || 10), p.maxAmmo);
            this.showMessage('+' + (it.data.amount || 10) + ' ПАТРОНОВ', 1000);
        } else if (it.type === 'armor') {
            p.armor = Math.min(p.armor + (it.data.value || 2), p.maxArmor);
            this.showMessage('+' + (it.data.value || 2) + ' БРОНИ', 1000);
        } else if (it.type === 'buff') {
            this.paused = true;
            document.exitPointerLock();
            this.showUpgradeMenu();
        }
    }

    checkBoss() {
        if (this.boss && !this.boss.alive && !this.bossDefeated) {
            this.bossDefeated = true;
            this.showMessage('БОСС ПОВЕРЖЕН!', 2000);

            // Spawn exit portal
            const ts = CONFIG.tileSize;
            this.exitPortal = this.spawnItem(this.dungeon.exit.x, this.dungeon.exit.y, 'portal');

            // Show super buff menu after delay
            setTimeout(() => {
                this.paused = true;
                document.exitPointerLock();
                this.showSuperBuffMenu();
            }, 1000);
        }

        // Boss HP bar
        if (this.boss && this.boss.alive) {
            const dist = this.player.pos.distanceTo(this.boss.pos);
            if (dist < 20) {
                document.getElementById('boss-bar').style.display = 'block';
                document.getElementById('boss-fill').style.width = (this.boss.hp / this.boss.maxHp * 100) + '%';
            } else {
                document.getElementById('boss-bar').style.display = 'none';
            }
        } else {
            document.getElementById('boss-bar').style.display = 'none';
        }
    }

    playerTakeDamage(dmg) {
        const p = this.player;

        // Armor absorbs
        if (p.armor > 0) {
            const absorbed = Math.min(p.armor, dmg);
            p.armor -= absorbed;
            dmg -= absorbed;
        }

        if (dmg > 0) {
            p.hp -= dmg;
            document.getElementById('damage-flash').style.opacity = '1';
            setTimeout(() => document.getElementById('damage-flash').style.opacity = '0', 100);
        }

        if (p.hp <= 0) {
            this.gameOver();
        }

        this.updateUI();
    }

    showUpgradeMenu() {
        const menu = document.getElementById('upgrade-menu');
        const opts = document.getElementById('upgrade-options');
        opts.innerHTML = '';

        const buffs = [
            { id: 'hp', name: '+1 HP', icon: '❤️' },
            { id: 'fireRate', name: '+1 СКОРОСТЬ', icon: '🔥' },
            { id: 'meleeDmg', name: '+1 УДАР', icon: '👊' },
            { id: 'rangedDmg', name: '+1 УРОН', icon: '🎯' }
        ];

        for (const b of buffs) {
            const div = document.createElement('div');
            div.className = 'menu-option';
            div.innerHTML = `<div class="option-icon">${b.icon}</div><div class="option-name">${b.name}</div>`;
            div.onclick = () => {
                this.player.buffs[b.id]++;
                if (b.id === 'hp') {
                    this.player.maxHp++;
                    this.player.hp++;
                }
                menu.style.display = 'none';
                this.paused = false;
                this.canvas.requestPointerLock();
                this.addBuffDisplay(b.name, b.icon);
            };
            opts.appendChild(div);
        }

        menu.style.display = 'block';
    }

    showSuperBuffMenu() {
        const menu = document.getElementById('super-menu');
        const opts = document.getElementById('super-options');
        opts.innerHTML = '';

        const allBuffs = [
            { id: 'chainLightning', name: 'МОЛНИЯ', desc: 'Бьет нескольких', icon: '⚡' },
            { id: 'ricochet', name: 'РИКОШЕТ', desc: 'Отскок пуль', icon: '🔄' },
            { id: 'bunnyHop', name: 'ПРЫЖОК', desc: 'Быстрее', icon: '🐰' },
            { id: 'instantKill', name: 'КАЗНЬ', desc: '5% смерть', icon: '💀' }
        ];

        // Random 2
        const shuffled = allBuffs.sort(() => Math.random() - 0.5).slice(0, 2);

        for (const b of shuffled) {
            const div = document.createElement('div');
            div.className = 'menu-option';
            div.innerHTML = `<div class="option-icon">${b.icon}</div><div class="option-name">${b.name}</div><div class="option-desc">${b.desc}</div>`;
            div.onclick = () => {
                this.player.superBuffs[b.id] = true;
                if (b.id === 'bunnyHop') this.player.speed *= 1.3;
                menu.style.display = 'none';
                this.paused = false;
                this.canvas.requestPointerLock();
                this.addBuffDisplay(b.name, b.icon, true);
                this.showMessage('ПОРТАЛ ОТКРЫТ!', 2000);
            };
            opts.appendChild(div);
        }

        menu.style.display = 'block';
    }

    addBuffDisplay(name, icon, isSuper = false) {
        const div = document.createElement('div');
        div.className = 'buff' + (isSuper ? ' super' : '');
        div.textContent = icon + ' ' + name;
        document.getElementById('buffs').appendChild(div);
    }

    updateUI() {
        const p = this.player;
        document.getElementById('hp-fill').style.width = (p.hp / p.maxHp * 100) + '%';
        document.getElementById('hp-text').textContent = p.hp + '/' + p.maxHp;
        document.getElementById('armor-fill').style.width = (p.armor / p.maxArmor * 100) + '%';
        document.getElementById('ammo').textContent = p.ammo;
        document.getElementById('level').textContent = this.level;
        document.getElementById('enemies').textContent = this.enemies.filter(e => e.alive).length;
    }

    updateMinimap() {
        const canvas = document.getElementById('minimap');
        const ctx = canvas.getContext('2d');
        canvas.width = 120;
        canvas.height = 120;

        const scale = 120 / this.dungeon.width;
        const ts = CONFIG.tileSize;

        ctx.fillStyle = '#001100';
        ctx.fillRect(0, 0, 120, 120);

        for (let y = 0; y < this.dungeon.height; y++) {
            for (let x = 0; x < this.dungeon.width; x++) {
                const t = this.dungeon.tiles[y][x];
                if (t === TILE.FLOOR) ctx.fillStyle = '#003300';
                else if (t === TILE.WALL) ctx.fillStyle = '#005500';
                else if (t === TILE.BOSS) ctx.fillStyle = '#330000';
                else continue;
                ctx.fillRect(x * scale, y * scale, scale, scale);
            }
        }

        // Enemies
        ctx.fillStyle = '#ff0000';
        for (const e of this.enemies) {
            if (!e.alive) continue;
            ctx.fillRect(e.pos.x / ts * scale - 1, e.pos.z / ts * scale - 1, 3, 3);
        }

        // Player
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(this.player.pos.x / ts * scale - 2, this.player.pos.z / ts * scale - 2, 4, 4);
    }

    showMessage(text, duration) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), duration);
    }

    gameOver() {
        this.running = false;
        document.exitPointerLock();

        const screen = document.getElementById('start-screen');
        screen.innerHTML = `
            <h1>GAME OVER</h1>
            <div class="sub">УРОВЕНЬ: ${this.level} | УБИТО: ${this.kills}</div>
            <button id="restart-btn">► ЗАНОВО</button>
        `;
        screen.style.display = 'flex';

        document.getElementById('restart-btn').onclick = () => this.start();
    }
}

// Start
new Game();
</script>
</body>
</html>
